name: testing

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provision_envs:
        description: "Create all workflow Conda environments (resource intensive)"
        type: boolean
        required: false
        default: false

jobs:
  cli-and-workflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ChloroScan
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<10"
      - name: Check CLI and full workflow DAG
        run: |
          python -m pytest -q tests/test_cli.py tests/test_workflow_dag.py

  provision-conda-environments:
    if: github.event_name == 'workflow_dispatch' && inputs.provision_envs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Create dedicated CLI environment
        shell: bash -el {0}
        run: |
          conda create -y -n chloroscan-ci -c conda-forge python=3.10 pip
          conda activate chloroscan-ci
          python -m pip install .
          conda --version
          python --version
          df -h
      - name: Provision all workflow environments
        shell: bash -el {0}
        run: |
          conda activate chloroscan-ci
          chloroscan run \
            --Inputs-assembly "$GITHUB_WORKSPACE/tests/test-data/test_plastid.fasta" \
            --Inputs-depth-txt "$GITHUB_WORKSPACE/tests/test-data/contig_depth_test.txt" \
            --Inputs-batch-name CI_PROVISION \
            --outputdir "$RUNNER_TEMP/chloroscan-output" \
            --cat-database "$GITHUB_WORKSPACE/tests/test-data/CAT_mini/db" \
            --cat-taxonomy "$GITHUB_WORKSPACE/tests/test-data/CAT_mini/tax" \
            --use-conda --conda-frontend=conda \
            --conda-create-envs-only \
            --conda-prefix="$RUNNER_TEMP/chloroscan-conda" \
            -c 2
