name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'pyproject.toml'
      - 'chloroscan/snk.yaml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to retry (for example v0.4.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches package versions
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Expected a release tag like v0.4.1, got {tag!r}")
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          cli = Path("chloroscan/snk.yaml").read_text()
          match = re.search(r"(?m)^version:\s*['\"]?([^\s'\"#]+)", cli)
          if match is None:
              raise SystemExit("Could not find CLI version in chloroscan/snk.yaml")
          cli_version = match.group(1)
          if version != tag[1:] or cli_version != version:
              raise SystemExit(
                  f"Version mismatch: tag={tag}, pyproject.toml={version}, "
                  f"chloroscan/snk.yaml={cli_version}. Bump both versions before tagging."
              )
          print(f"Validated release version {version}")
          PY
      - name: Install isolated build and upload tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload to PyPI
        if: github.event_name != 'pull_request'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_TOKEN repository secret is not set"
            exit 1
          fi
          python -m twine upload dist/*
